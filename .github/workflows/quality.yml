name: Build and test

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm ci --prefix dashboard
      - run: npm install --global firebase-tools@15.34.1
      - run: cp src/firebase.example.js src/firebase.js
      - run: npm run build
      - run: npm test
